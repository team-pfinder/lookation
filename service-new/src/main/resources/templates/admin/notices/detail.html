<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>공지 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">공지 상세</h1>
    <div class="card shadow"><div class="card-body">
        <dl class="row"><dt class="col-sm-2">제목</dt><dd class="col-sm-10" th:text="${notice.title}"></dd>
        <dt class="col-sm-2">본문</dt><dd class="col-sm-10" th:text="${notice.content}"></dd>
        <dt class="col-sm-2">중요</dt><dd class="col-sm-10" th:text="${notice.important}"></dd></dl>
        <a class="btn btn-primary" th:href="@{/admin/notices/{id}/edit(id=${notice.id})}">수정</a>
        <form class="d-inline" th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post"><button class="btn btn-danger" type="submit">삭제</button></form>
    </div></div>
</section></body></html>
