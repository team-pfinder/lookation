<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>공지사항 목록 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">공지사항 목록 <a class="btn btn-primary btn-sm" th:href="@{/admin/notices/new}">등록</a></h1>
    <div class="card shadow"><div class="card-body"><table class="table table-bordered">
        <thead><tr><th>ID</th><th>제목</th><th>중요</th><th>일시</th><th></th></tr></thead>
        <tbody><tr th:each="n : ${page.items}">
            <td th:text="${n.id}"></td><td><a th:href="@{/admin/notices/{id}(id=${n.id})}" th:text="${n.title}"></a></td><td th:text="${n.important}"></td><td th:text="${n.createdAt}"></td>
            <td><a class="btn btn-sm btn-primary" th:href="@{/admin/notices/{id}(id=${n.id})}">상세</a></td>
        </tr><tr th:if="${page.items.isEmpty()}"><td colspan="5" class="text-center">조회 결과가 없습니다.</td></tr></tbody></table>
        <div th:if="${page.nextCursor != null}"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/notices(cursor=${page.nextCursor})}">다음</a></div>
    </div></div>
</section></body></html>
