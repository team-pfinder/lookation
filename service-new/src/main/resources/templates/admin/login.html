<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>관리자 로그인 · Lookation</title>
    <link rel="stylesheet" th:href="@{/vendor/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/sb-admin-2.min.css}">
</head>
<body class="bg-gradient-primary">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-6 col-md-8">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Welcome Admin!</h1>
                                </div>
                                <div class="alert alert-success" role="alert" th:if="${notice}" th:text="${notice}"></div>
                                <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
                                <form th:action="@{/admin/login}" th:object="${form}" method="post" novalidate>
                                    <input type="hidden" th:field="*{next}">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user" id="admin_id" th:field="*{email}" placeholder="ID" autocomplete="username">
                                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user" id="admin_pw" th:field="*{password}" placeholder="Password" autocomplete="current-password">
                                        <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">Login</button>
                                </form>
                                <hr>
                                <div class="text-center small text-muted">일반 회원은 <a th:href="@{/login}">회원 로그인</a>으로 입장해 주세요.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
