<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>리뷰 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">리뷰 상세</h1>
    <div class="card shadow"><div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <dl class="row"><dt class="col-sm-2">평점</dt><dd class="col-sm-10" th:text="${@fmt.rating(review.rating)}"></dd>
        <dt class="col-sm-2">내용</dt><dd class="col-sm-10" th:text="${review.content}"></dd>
        <dt class="col-sm-2">답글</dt><dd class="col-sm-10" th:text="${review.reply != null ? review.reply : '-'}"></dd>
        <dt class="col-sm-2">블라인드 일시</dt><dd class="col-sm-10" th:text="${review.blindedAt != null ? @fmt.dateTime(review.blindedAt) : '공개' }"></dd></dl>
        <form th:if="${review.blindedAt == null}" th:action="@{/admin/reviews/{id}/blind(id=${review.id})}" method="post"><button class="btn btn-danger" type="submit">블라인드</button></form>
        <div class="alert alert-secondary mb-0" th:if="${review.blindedAt != null}">블라인드된 리뷰입니다</div>
    </div></div>
</section></body></html>
