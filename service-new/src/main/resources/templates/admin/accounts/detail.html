<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>회원 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">회원 상세</h1>
    <div class="card shadow mb-4"><div class="card-body">
        <dl class="row">
            <dt class="col-sm-2">ID</dt><dd class="col-sm-10" th:text="${account.id}"></dd>
            <dt class="col-sm-2">이메일</dt><dd class="col-sm-10" th:text="${account.email}"></dd>
            <dt class="col-sm-2">이름</dt><dd class="col-sm-10" th:text="${account.name}"></dd>
            <dt class="col-sm-2">닉네임</dt><dd class="col-sm-10" th:text="${account.nickname}"></dd>
            <dt class="col-sm-2">역할</dt><dd class="col-sm-10"><span th:each="r : ${account.roles}" class="badge badge-secondary mx-1" th:text="${r}"></span></dd>
        </dl>
    </div></div>

    <div class="card shadow mb-4">
        <div class="card-header"><h6 class="m-0 font-weight-bold text-primary">제재 등록</h6></div>
        <div class="card-body">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/admin/accounts/{id}/sanctions(id=${account.id})}" th:object="${form}" method="post">
                <div class="form-group"><label>제재 단계 (1~3)</label>
                    <select class="form-control" th:field="*{level}">
                        <option value="1">1차 (7일 권장)</option><option value="2">2차 (30일 권장)</option><option value="3">3차 (영구 권장)</option>
                    </select></div>
                <div class="form-group"><label>사유</label><input class="form-control" th:field="*{reason}"><small class="text-danger" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></small></div>
                <div class="form-group"><label>종료 일시 (비우면 1차 7일, 2차 30일, 3차 영구)</label><input class="form-control" type="datetime-local" th:field="*{endsAt}"></div>
                <button class="btn btn-danger" type="submit">제재 등록</button>
            </form>
        </div>
    </div>

    <div class="card shadow"><div class="card-header"><h6 class="m-0 font-weight-bold text-primary">제재 이력</h6></div><div class="card-body">
        <table class="table table-bordered"><thead><tr><th>ID</th><th>단계</th><th>사유</th><th>시작</th><th>종료</th><th>해제</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${sanctions}">
            <td th:text="${s.id}"></td><td th:text="|${s.level}차|"></td><td th:text="${s.reason}"></td><td th:text="${@fmt.dateTime(s.startsAt)}"></td><td th:text="${s.endsAt != null ? @fmt.dateTime(s.endsAt) : '영구'}"></td><td th:text="${s.revokedAt != null ? '해제됨' : '활성'}"></td>
            <td><form th:action="@{/admin/sanctions/{id}/revoke(id=${s.id})}" method="post" th:if="${s.revokedAt == null}">
                <input type="hidden" name="accountId" th:value="${account.id}">
                <button class="btn btn-sm btn-secondary" type="submit">해제</button></form></td>
        </tr>
        <tr th:if="${sanctions.isEmpty()}"><td colspan="7" class="text-center">제재 이력이 없습니다.</td></tr>
        </tbody></table>
    </div></div>
</section></body></html>
