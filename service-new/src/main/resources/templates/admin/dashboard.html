<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>대시보드 · 관리자 콘솔</title></head>
<body>
<section>
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
    </div>
    <div class="row">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">공간 검수 대기</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${pendingInspections}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-fw fa-home fa-2x text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-danger shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">신고 대기</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${pendingReports}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-fw fa-flag fa-2x text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">충전 대기</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${pendingCharges}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-fw fa-coins fa-2x text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">출금 대기</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${pendingWithdrawals}">0</div>
                        </div>
                        <div class="col-auto"><i class="fas fa-fw fa-money-check fa-2x text-gray-300"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="card shadow mb-4">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">처리 바로가기</h6></div>
                <div class="card-body">
                    <a class="btn btn-primary mr-2 mb-2" th:href="@{/admin/inspections}">공간검수</a>
                    <a class="btn btn-danger mr-2 mb-2" th:href="@{/admin/reports}">신고내역</a>
                    <a class="btn btn-warning mr-2 mb-2" th:href="@{/admin/charges}">충전관리</a>
                    <a class="btn btn-info mr-2 mb-2" th:href="@{/admin/withdrawals}">출금관리</a>
                    <a class="btn btn-secondary mr-2 mb-2" th:href="@{/admin/accounts}">이용자·호스트관리</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
