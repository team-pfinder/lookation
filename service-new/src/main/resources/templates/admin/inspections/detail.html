<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>공간 검수 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">공간 검수 상세</h1>
    <div class="card shadow"><div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <dl class="row">
            <dt class="col-sm-2">ID</dt><dd class="col-sm-10" th:text="${space.id}"></dd>
            <dt class="col-sm-2">공간명</dt><dd class="col-sm-10" th:text="${space.name}"></dd>
            <dt class="col-sm-2">주소</dt><dd class="col-sm-10" th:text="${space.address}"></dd>
            <dt class="col-sm-2">유형</dt><dd class="col-sm-10" th:text="${space.spaceType}"></dd>
            <dt class="col-sm-2">인원</dt><dd class="col-sm-10" th:text="${space.minCapacity} + ' - ' + ${space.maxCapacity}"></dd>
            <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${space.status}"></dd>
            <dt class="col-sm-2">소개</dt><dd class="col-sm-10" th:text="${space.description}"></dd>
        </dl>
        <form class="d-inline" th:action="@{/admin/inspections/{id}/decision(id=${space.id})}" method="post">
            <input type="hidden" name="approved" value="true"><button class="btn btn-success" type="submit">승인</button>
        </form>
        <form class="d-inline mt-3" th:action="@{/admin/inspections/{id}/decision(id=${space.id})}" method="post">
            <input type="hidden" name="approved" value="false">
            <input class="form-control d-inline-block w-auto" name="reason" placeholder="반려 사유" required>
            <button class="btn btn-danger" type="submit">반려</button>
        </form>
    </div></div>
</section></body></html>
