<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>신고 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">신고 상세</h1>
    <div class="card shadow mb-4"><div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <dl class="row">
            <dt class="col-sm-2">ID</dt><dd class="col-sm-10" th:text="${report.id}"></dd>
            <dt class="col-sm-2">신고자</dt>
            <dd class="col-sm-10" th:if="${detail.reporter != null}">
                <span th:text="${detail.reporter.nickname}"></span>
                (<span th:text="${detail.reporter.email}"></span>)
                · <span th:text="${detail.reporter.name}"></span>
            </dd>
            <dd class="col-sm-10" th:if="${detail.reporter == null}">신고자 정보를 찾을 수 없습니다</dd>
            <dt class="col-sm-2">대상</dt><dd class="col-sm-10" th:text="${report.targetType} + ' #' + ${report.targetId}"></dd>
            <dt class="col-sm-2">사유</dt><dd class="col-sm-10" th:text="${report.reason}"></dd>
            <dt class="col-sm-2">상태</dt>
            <dd class="col-sm-10">
                <span class="badge" th:classappend="${@fmt.badgeClass(report.status.name())}" th:text="${@fmt.reportStatus(report.status)}"></span>
                <span class="text-muted small" th:text="${report.status}"></span>
            </dd>
            <dt class="col-sm-2">일시</dt><dd class="col-sm-10" th:text="${@fmt.dateTime(report.createdAt)}"></dd>
        </dl>
        <form class="d-inline" th:action="@{/admin/reports/{id}/decision(id=${report.id})}" method="post" th:if="${report.status.name() == 'RECEIVED'}">
            <input type="hidden" name="accepted" value="true"><button class="btn btn-success" type="submit">인정</button>
        </form>
        <form class="d-inline" th:action="@{/admin/reports/{id}/decision(id=${report.id})}" method="post" th:if="${report.status.name() == 'RECEIVED'}">
            <input type="hidden" name="accepted" value="false"><button class="btn btn-danger" type="submit">기각</button>
        </form>
    </div></div>

    <div class="card shadow"><div class="card-header"><h6 class="m-0 font-weight-bold text-primary">신고 대상</h6></div><div class="card-body">
        <div class="alert alert-warning mb-0" th:if="${detail.target == null}">신고 대상을 찾을 수 없습니다</div>
        <dl class="row mb-0" th:if="${detail.target != null}" th:with="target=${detail.target}">
            <th:block th:if="${target.targetType.name() == 'SPACE'}">
                <dt class="col-sm-2">공간명</dt><dd class="col-sm-10" th:text="${target.name}"></dd>
                <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${@fmt.spaceStatus(target.status)}"></dd>
                <dt class="col-sm-2">호스트</dt><dd class="col-sm-10" th:text="${target.hostId}"></dd>
                <dt class="col-sm-2">주소</dt><dd class="col-sm-10" th:text="${target.address}"></dd>
                <dt class="col-sm-2">유형</dt><dd class="col-sm-10" th:text="${@fmt.spaceType(target.spaceType)}"></dd>
                <dt class="col-sm-2">인원</dt><dd class="col-sm-10" th:text="|${target.minCapacity} - ${target.maxCapacity}명|"></dd>
                <dt class="col-sm-2">설명</dt><dd class="col-sm-10" th:text="${target.description != null ? target.description : '-'}"></dd>
            </th:block>
            <th:block th:if="${target.targetType.name() == 'RESERVATION'}">
                <dt class="col-sm-2">예약 ID</dt><dd class="col-sm-10" th:text="${target.targetId}"></dd>
                <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${@fmt.status(target.status)}"></dd>
                <dt class="col-sm-2">공간 ID</dt><dd class="col-sm-10" th:text="${target.spaceId}"></dd>
                <dt class="col-sm-2">회원 ID</dt><dd class="col-sm-10" th:text="${target.memberId}"></dd>
                <dt class="col-sm-2">호스트 ID</dt><dd class="col-sm-10" th:text="${target.hostId}"></dd>
                <dt class="col-sm-2">기간</dt><dd class="col-sm-10"><span th:text="${@fmt.dateTime(target.startAt)}"></span> ~ <span th:text="${@fmt.dateTime(target.endAt)}"></span></dd>
                <dt class="col-sm-2">금액</dt><dd class="col-sm-10" th:text="${@fmt.won(target.price)}"></dd>
                <dt class="col-sm-2">인원</dt><dd class="col-sm-10" th:text="|${target.guestCount}명|"></dd>
            </th:block>
            <th:block th:if="${target.targetType.name() == 'REVIEW'}">
                <dt class="col-sm-2">리뷰 ID</dt><dd class="col-sm-10" th:text="${target.targetId}"></dd>
                <dt class="col-sm-2">공개 상태</dt><dd class="col-sm-10" th:text="${target.blindedAt != null ? '블라인드' : '공개'}"></dd>
                <dt class="col-sm-2">작성자</dt><dd class="col-sm-10" th:text="${target.author}"></dd>
                <dt class="col-sm-2">평점</dt><dd class="col-sm-10" th:text="${@fmt.rating(target.rating)}"></dd>
                <dt class="col-sm-2">내용</dt><dd class="col-sm-10" th:text="${target.content}"></dd>
                <dt class="col-sm-2">답글</dt><dd class="col-sm-10" th:text="${target.reply != null ? target.reply : '-'}"></dd>
            </th:block>
            <th:block th:if="${target.targetType.name() == 'QNA'}">
                <dt class="col-sm-2">문의 ID</dt><dd class="col-sm-10" th:text="${target.targetId}"></dd>
                <dt class="col-sm-2">제목</dt><dd class="col-sm-10" th:text="${target.title}"></dd>
                <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${@fmt.qnaStatus(target.status)}"></dd>
                <dt class="col-sm-2">작성자</dt><dd class="col-sm-10" th:text="${target.author}"></dd>
                <dt class="col-sm-2">공간 ID</dt><dd class="col-sm-10" th:text="${target.spaceId}"></dd>
                <dt class="col-sm-2">내용</dt><dd class="col-sm-10" th:text="${target.content}"></dd>
                <dt class="col-sm-2">답글</dt><dd class="col-sm-10" th:text="${target.reply != null ? target.reply : '-'}"></dd>
            </th:block>
            <th:block th:if="${target.targetType.name() == 'ACCOUNT'}">
                <dt class="col-sm-2">계정 ID</dt><dd class="col-sm-10" th:text="${target.targetId}"></dd>
                <dt class="col-sm-2">이메일</dt><dd class="col-sm-10" th:text="${target.email}"></dd>
                <dt class="col-sm-2">이름</dt><dd class="col-sm-10" th:text="${target.name}"></dd>
                <dt class="col-sm-2">닉네임</dt><dd class="col-sm-10" th:text="${target.nickname}"></dd>
                <dt class="col-sm-2">역할</dt><dd class="col-sm-10"><span th:each="r : ${target.roles}" class="badge badge-secondary mx-1" th:text="${r}"></span></dd>
                <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${@fmt.accountStatus(target.status)}"></dd>
            </th:block>
        </dl>
    </div></div>
</section></body></html>
