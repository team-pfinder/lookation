<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>신고내역 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">신고내역</h1>
    <form method="get" th:action="@{/admin/reports}" class="mb-3 form-inline">
        <label class="mr-2" for="status">상태</label>
        <select id="status" name="status" class="form-control mr-2">
            <option value="">전체</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${statusFilter == s}" th:text="${s}"></option>
        </select>
        <label class="mr-2" for="targetType">대상</label>
        <select id="targetType" name="targetType" class="form-control mr-2">
            <option value="">전체</option>
            <option th:each="t : ${targets}" th:value="${t}" th:selected="${targetFilter == t}" th:text="${t}"></option>
        </select>
        <button class="btn btn-primary" type="submit">조회</button>
    </form>
    <div class="card shadow"><div class="card-body"><div class="table-responsive"><table class="table table-bordered">
        <thead><tr><th>ID</th><th>신고자</th><th>대상</th><th>사유</th><th>상태</th><th>일시</th><th></th></tr></thead>
        <tbody>
        <tr th:each="r : ${page.items}">
            <td th:text="${r.id}"></td><td th:text="${r.reporterId}"></td><td th:text="${r.targetType} + ' #' + ${r.targetId}"></td>
            <td th:text="${r.reason}"></td><td th:text="${r.status}"></td><td th:text="${r.createdAt}"></td>
            <td><a class="btn btn-sm btn-primary" th:href="@{/admin/reports/{id}(id=${r.id})}">상세</a></td>
        </tr>
        <tr th:if="${page.items.isEmpty()}"><td colspan="7" class="text-center">조회 결과가 없습니다.</td></tr>
        </tbody></table></div>
        <div th:if="${page.nextCursor != null}"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/reports(status=${statusFilter}, targetType=${targetFilter}, cursor=${page.nextCursor})}">다음</a></div>
    </div></div>
</section></body></html>
