<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>출금 상세 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">출금 상세</h1>
    <div class="card shadow"><div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <dl class="row"><dt class="col-sm-2">ID</dt><dd class="col-sm-10" th:text="${withdrawal.id}"></dd>
        <dt class="col-sm-2">금액</dt><dd class="col-sm-10" th:text="${withdrawal.amount}"></dd>
        <dt class="col-sm-2">상태</dt><dd class="col-sm-10" th:text="${withdrawal.status}"></dd></dl>
        <form class="d-inline" th:action="@{/admin/withdrawals/{id}/decision(id=${withdrawal.id})}" method="post" th:if="${withdrawal.status.name() == 'REQUESTED'}">
            <input type="hidden" name="approved" value="true"><button class="btn btn-success" type="submit">승인</button></form>
        <form class="d-inline" th:action="@{/admin/withdrawals/{id}/decision(id=${withdrawal.id})}" method="post" th:if="${withdrawal.status.name() == 'REQUESTED'}">
            <input type="hidden" name="approved" value="false"><button class="btn btn-danger" type="submit">거절</button></form>
    </div></div>
</section></body></html>
