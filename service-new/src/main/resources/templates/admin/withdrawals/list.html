<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>출금관리 · 관리자 콘솔</title></head>
<body><section>
    <h1 class="h3 mb-4 text-gray-800">출금관리</h1>
    <form method="get" th:action="@{/admin/withdrawals}" class="mb-3 form-inline">
        <label class="mr-2" for="status">상태</label>
        <select id="status" name="status" class="form-control mr-2"><option value="">전체</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${statusFilter == s}" th:text="${s}"></option></select>
        <button class="btn btn-primary" type="submit">조회</button>
    </form>
    <div class="card shadow"><div class="card-body"><table class="table table-bordered">
        <thead><tr><th>ID</th><th>금액</th><th>상태</th><th></th></tr></thead>
        <tbody><tr th:each="w : ${page.items}">
            <td th:text="${w.id}"></td><td th:text="${w.amount}"></td><td th:text="${w.status}"></td>
            <td><a class="btn btn-sm btn-primary" th:href="@{/admin/withdrawals/{id}(id=${w.id})}">상세</a></td>
        </tr><tr th:if="${page.items.isEmpty()}"><td colspan="4" class="text-center">조회 결과가 없습니다.</td></tr></tbody></table>
        <div th:if="${page.nextCursor != null}"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/withdrawals(status=${statusFilter}, cursor=${page.nextCursor})}">다음</a></div>
    </div></div>
</section></body></html>
